<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <!-- 沒有 JS 時的後備轉址 -->
  <meta http-equiv="refresh" content="0; url=/home/">
  <!-- 告訴搜尋引擎正本是 /home/，SEO 不會被中轉頁稀釋 -->
  <link rel="canonical" href="https://kueichi.dev/home/">
  <title>Redirecting…</title>
  <!-- 主力：用 replace 不留上一頁紀錄，避免按「上一頁」又被彈回造成迴圈；
       帶上 search 與 hash，網址列的參數與錨點不會掉 -->
  <script>location.replace("/home/" + location.search + location.hash);</script>
</head>
<body>
  <p>正在前往 <a href="/home/">kueichi.dev/home/</a>…</p>
</body>
</html>
