<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語音辨識 · Speech Recognition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #2a2f3a;
    --ink: #e8eaf0;
    --muted: #7d8493;
    --accent: #ff5d3b;
    --accent-soft: rgba(255, 93, 59, 0.12);
    --live: #4cd4a0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif TC', serif;
    background:
      radial-gradient(900px 600px at 85% -10%, rgba(255,93,59,0.10), transparent 60%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  .wrap { width: 100%; max-width: 720px; }

  header { margin-bottom: 36px; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  h1 {
    font-size: clamp(38px, 7vw, 60px);
    font-weight: 900;
    line-height: 0.98;
    letter-spacing: -0.01em;
  }
  h1 .en { color: var(--muted); font-weight: 400; display: block; font-size: 0.4em; letter-spacing: 0.08em; margin-top: 10px; }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin: 30px 0 24px;
    flex-wrap: wrap;
  }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    cursor: pointer;
    transition: transform .12s ease, background .2s ease, opacity .2s ease;
    letter-spacing: 0.04em;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-mic {
    background: var(--accent);
    color: #1a0d09;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-mic.recording { background: var(--live); color: #06241a; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); }

  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #1a0d09;
  }
  .recording .dot { background: #06241a; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

  select {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 13px 18px;
    cursor: pointer;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px;
    min-height: 260px;
    position: relative;
    overflow: hidden;
  }

  .panel-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
  }
  #status { color: var(--accent); }

  #final {
    font-size: 21px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #interim {
    color: var(--muted);
    font-style: italic;
  }
  .placeholder { color: var(--muted); font-size: 16px; }

  footer {
    margin-top: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  footer b { color: var(--ink); font-weight: 700; }

  .err {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 16px;
    border-radius: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    margin-top: 18px;
    display: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Web Speech API</div>
    <h1>語音辨識<span class="en">speech to text in your browser</span></h1>
  </header>

  <div class="controls">
    <button id="toggle" class="btn-mic">
      <span class="dot"></span><span id="toggleText">開始辨識</span>
    </button>
    <button id="clear" class="btn-ghost">清除</button>
    <button id="copy" class="btn-ghost">複製</button>
    <select id="lang">
      <option value="zh-TW">中文（台灣）</option>
      <option value="zh-CN">中文（普通話）</option>
      <option value="en-US">English (US)</option>
      <option value="ja-JP">日本語</option>
    </select>
  </div>

  <div class="panel">
    <div class="panel-label">
      <span>辨識結果 / Transcript</span>
      <span id="status">待命</span>
    </div>
    <div id="output">
      <span class="placeholder">按下「開始辨識」，然後對著麥克風說話…</span>
    </div>
  </div>

  <div id="error" class="err"></div>

  <footer>
    建議使用 <b>Chrome</b> 或 <b>Edge</b>。首次使用需允許麥克風權限。<br>
    勾選持續模式時會一直聆聽，講完一段會自動換行。
  </footer>
</div>

<script>
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const toggleBtn = document.getElementById('toggle');
  const toggleText = document.getElementById('toggleText');
  const clearBtn = document.getElementById('clear');
  const copyBtn = document.getElementById('copy');
  const langSel = document.getElementById('lang');
  const output = document.getElementById('output');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');

  let recognition = null;
  let listening = false;
  let finalText = '';

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  if (!SpeechRecognition) {
    showError('此瀏覽器不支援 Web Speech API。請改用 Chrome 或 Edge。');
    toggleBtn.disabled = true;
  }

  function render(interim) {
    if (!finalText && !interim) {
      output.innerHTML = '<span class="placeholder">按下「開始辨識」，然後對著麥克風說話…</span>';
      return;
    }
    output.innerHTML =
      '<span id="final">' + finalText + '</span>' +
      (interim ? '<span id="interim">' + interim + '</span>' : '');
  }

  function buildRecognition() {
    const rec = new SpeechRecognition();
    rec.lang = langSel.value;
    rec.continuous = true;
    rec.interimResults = true;

    rec.onstart = () => {
      listening = true;
      statusEl.textContent = '● 聆聽中';
      toggleText.textContent = '停止辨識';
      toggleBtn.classList.add('recording');
      errorEl.style.display = 'none';
    };

    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finalText += t + '\n';
        } else {
          interim += t;
        }
      }
      render(interim);
    };

    rec.onerror = (e) => {
      if (e.error === 'no-speech') return;
      if (e.error === 'not-allowed') {
        showError('麥克風權限被拒絕。請在瀏覽器設定允許麥克風。');
      } else {
        showError('辨識錯誤：' + e.error);
      }
    };

    rec.onend = () => {
      // continuous 模式偶爾會自動結束，若使用者仍想聽就重啟
      if (listening) {
        try { rec.start(); } catch (_) {}
      } else {
        statusEl.textContent = '待命';
        toggleText.textContent = '開始辨識';
        toggleBtn.classList.remove('recording');
      }
    };

    return rec;
  }

  toggleBtn.addEventListener('click', () => {
    if (!listening) {
      recognition = buildRecognition();
      try { recognition.start(); } catch (_) {}
    } else {
      listening = false;
      recognition && recognition.stop();
    }
  });

  clearBtn.addEventListener('click', () => {
    finalText = '';
    render('');
  });

  copyBtn.addEventListener('click', async () => {
    if (!finalText) return;
    try {
      await navigator.clipboard.writeText(finalText.trim());
      copyBtn.textContent = '已複製 ✓';
      setTimeout(() => copyBtn.textContent = '複製', 1500);
    } catch (_) {}
  });

  langSel.addEventListener('change', () => {
    if (listening) {
      listening = false;
      recognition && recognition.stop();
    }
  });
</script>
</body>
</html>
